F<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Т—Недвижимость · Баллы и комиссии</title>
<style>
:root {
  --bg-1: #0D1136;
  --bg-2: #1A1F52;
  --card: #FFFFFF;
  --card-2: #F7F5F1;
  --ink: #14183F;
  --text-light: #FFFFFF;
  --text-cream: #F3F0E8;
  --gold: #B8935B;
  --gold-light: #D4B483;
  --gold-grad: linear-gradient(135deg, #D4B483 0%, #B8935B 55%, #A07C48 100%);
  --coral: #D9694E;
  --slate: #6B7280;
  --slate-light: #B9BEDC;
  --line: #E7E4DC;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body {
  height: 100%; margin: 0; padding: 0;
  font-family: 'Inter', Arial, sans-serif;
  background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-1) 100%);
  color: var(--text-cream);
}
a { text-decoration: none; color: inherit; }
img { max-width: 100%; }
::-webkit-scrollbar { height: 10px; width: 10px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 6px; }

.wrap { max-width: 1360px; margin: 0 auto; }

/* ---------- Header ---------- */
.site-header {
  display: flex; justify-content: space-between; align-items: flex-end;
  padding: 22px 28px 16px 28px;
  background: linear-gradient(120deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 60%);
  border-bottom: 2px solid transparent;
  border-image: var(--gold-grad) 1;
  flex-wrap: wrap; gap: 14px;
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  backdrop-filter: blur(6px);
}
.brand { display: flex; align-items: center; gap: 14px; }
.brand img { width: 44px; height: 44px; flex-shrink: 0; display: block; }
.brand h1 {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em;
  margin: 0; color: var(--text-light);
}
.brand p { margin: 2px 0 0 0; color: var(--slate-light); font-size: 12.5px; }

.header-right { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.who-box { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--slate-light); }
.who-avatar { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--gold); }

.month-wrap { position: relative; }
.month-box { display: flex; flex-direction: column; gap: 4px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--slate-light); }
.month-box select {
  font-family: 'SFMono-Regular', Consolas, monospace; font-size: 13px; padding: 7px 10px;
  border: 1.5px solid var(--gold); border-radius: 4px; background: var(--card); color: var(--ink); min-width: 160px;
}
.add-month-btn {
  background: var(--gold-grad); color: #221708; border: none; border-radius: 5px;
  padding: 8px 13px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
}
.add-month-btn:hover { filter: brightness(1.08); }
.add-month-form {
  display: none; gap: 8px; align-items: flex-end; background: var(--card); border-radius: 8px; padding: 10px; margin-top: 8px;
  position: absolute; right: 0; box-shadow: 0 10px 30px rgba(0,0,0,0.35); z-index: 40;
}
.add-month-form.open { display: flex; }
.add-month-form label { display: flex; flex-direction: column; gap: 3px; font-size: 10px; color: var(--slate); text-transform: uppercase; }
.add-month-form select { font-size: 13px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--card-2); color: var(--ink); }

/* ---------- Nav tabs ---------- */
.tabs { display: flex; gap: 2px; padding: 12px 28px 0 28px; flex-wrap: wrap; align-items: center; justify-content: space-between; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 68px); z-index: 25; background: var(--bg-1); }
.tabs-left { display: flex; flex-wrap: wrap; }
.tab {
  font-family: 'Inter', Arial, sans-serif; font-weight: 600; font-size: 13px;
  padding: 10px 16px; background: transparent; border: none; border-bottom: 3px solid transparent;
  color: var(--slate-light); cursor: pointer; transition: color .15s, border-color .15s;
}
.tab:hover { color: var(--gold-light); }
.tab.active { color: var(--text-light); border-bottom-color: var(--gold); }
.sync-note { font-size: 11px; color: var(--slate-light); display: flex; align-items: center; gap: 6px; padding-bottom: 10px; }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #7FBF8A; box-shadow: 0 0 6px #7FBF8A; }
.sync-dot.saving { background: var(--gold); box-shadow: 0 0 6px var(--gold); animation: pulse 0.9s infinite; }
.sync-dot.off { background: var(--coral); box-shadow: 0 0 6px var(--coral); }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }

.main { padding: 22px 28px 48px 28px; }
.section-title {
  font-family: Georgia, 'Times New Roman', serif; font-size: 16px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.04em; color: var(--gold-light); margin: 26px 0 13px 0;
}
.section-title:first-child { margin-top: 0; }
.card {
  background: var(--card); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px;
  padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.22); color: var(--ink);
}
.muted { color: var(--slate); font-size: 13px; }
.muted.on-dark { color: var(--slate-light); }
.muted.small { font-size: 12px; margin-top: 10px; }
.empty { padding: 12px 0; }

/* ---------- KPI ---------- */
.dash-top { display: flex; gap: 16px; flex-wrap: wrap; }
.kpi {
  background: var(--card); border-radius: 10px; padding: 16px 22px; min-width: 190px; flex: 1;
  border-left: 4px solid; border-image: var(--gold-grad) 1; color: var(--ink);
  box-shadow: 0 8px 24px rgba(0,0,0,0.22);
}
.kpi-label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--slate); margin-bottom: 6px; }
.kpi-value { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 23px; font-weight: 700; color: var(--ink); }
.kpi-value.gold { background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* ---------- Gauges ---------- */
.seal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px,1fr)); gap: 16px; }
.seal-card { background: var(--card); border-radius: 10px; padding: 16px; display: flex; gap: 14px; align-items: center; box-shadow: 0 8px 24px rgba(0,0,0,0.22); color: var(--ink); }
.seal-num { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 21px; font-weight: 700; fill: var(--ink); }
.seal-sub { font-size: 9px; fill: var(--slate); text-transform: uppercase; letter-spacing: 0.06em; }
.seal-tier { font-family: Georgia, serif; font-size: 13px; font-weight: 700; fill: var(--gold); }
.seal-meta h3 { font-family: Georgia, serif; margin: 0 0 2px 0; font-size: 15px; color: var(--ink); }
.thresh-row { display: flex; flex-direction: column; gap: 2px; font-size: 11px; font-family: 'SFMono-Regular', Consolas, monospace; color: var(--slate); margin: 8px 0; }
.thresh-row .hit { color: #8A6A32; font-weight: 700; }
.bonus-row { display: flex; gap: 14px; font-size: 12px; margin-bottom: 6px; color: var(--ink); }
.bonus-final { font-size: 13px; font-weight: 700; color: #8A6A32; }
.warn-pill { margin-top: 8px; display: inline-block; background: #FBE7E0; color: #B8492F; border-radius: 20px; padding: 3px 10px; font-size: 11px; font-weight: 700; }

/* ---------- Tables ---------- */
.table-scroll { overflow-x: auto; margin-bottom: 8px; background: var(--card); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.22); }
.table-scroll .tbl { min-width: 620px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; color: var(--ink); }
.tbl th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--slate); border-bottom: 1.5px solid var(--gold); padding: 10px; white-space: nowrap; }
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line); font-family: 'SFMono-Regular', Consolas, monospace; white-space: nowrap; }
.tbl td.bad { color: var(--coral); font-weight: 700; }
.tbl td.good { color: #7C9A6E; font-weight: 700; }
.tbl td.gold { color: #9A7A42; font-weight: 700; }
.tbl td.rank { font-family: Georgia, serif; font-weight: 700; color: var(--gold); text-align: center; }
.tbl td.rowname { font-family: 'Inter', Arial, sans-serif; font-weight: 600; color: var(--ink); white-space: normal; }

/* ---------- Entry form ---------- */
.entry { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
@media (max-width: 860px) { .entry { grid-template-columns: 1fr; } }
.form-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.form-row label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--slate); text-transform: uppercase; letter-spacing: .05em; flex: 1; min-width: 140px; }
select, input[type=text], input[type=number], input[type=password] {
  font-family: 'Inter', Arial, sans-serif; font-size: 13px; padding: 8px 10px;
  border: 1.5px solid var(--line); border-radius: 5px; background: var(--card-2); color: var(--ink); width: 100%;
}
.counters { display: grid; grid-template-columns: repeat(auto-fill, minmax(138px,1fr)); gap: 10px; margin-bottom: 10px; }
.counter { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--card-2); }
.counter.boosted { background: linear-gradient(135deg, #FBF0DE, #F5E2C2); border-color: var(--gold); }
.counter.boosted .counter-label i { color: #A85A3A; }
.counter-label { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; margin-bottom: 6px; color: var(--ink); }
.counter-label i { font-style: normal; color: #9A7A42; font-weight: 700; font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11px; }
.counter-controls { display: flex; align-items: center; justify-content: space-between; }
.counter-controls button { width: 26px; height: 26px; border-radius: 5px; border: 1px solid var(--gold); background: #fff; color: #9A7A42; font-size: 15px; cursor: pointer; line-height: 1; }
.counter-controls button:hover { background: var(--gold-grad); color: #fff; border-color: transparent; }
.counter-controls span { font-family: 'SFMono-Regular', Consolas, monospace; font-weight: 700; color: var(--ink); }

.entry-footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border-top: 1px dashed var(--line); padding-top: 14px; color: var(--ink); }
.entry-footer .bad { color: var(--coral); font-style: normal; margin-left: 6px; font-size: 12px; font-weight: 700; }
.entry-footer .good { color: #6E8C60; font-style: normal; margin-left: 6px; font-size: 12px; font-weight: 700; }

.btn-primary { background: var(--gold-grad); color: #221708; border: none; border-radius: 5px; padding: 9px 18px; font-size: 13px; font-weight: 700; cursor: pointer; }
.btn-primary:hover { filter: brightness(1.08); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--slate); border-radius: 5px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
.btn-ghost:hover { border-color: var(--coral); color: var(--coral); }
.btn-ghost.small { padding: 2px 8px; }

.log-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; color: var(--ink); flex-wrap: wrap; gap: 8px; }

/* ---------- Team ---------- */
.add-rop { margin-bottom: 20px; }
.inline-add { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.inline-add.small { margin-top: 12px; }
.inline-add input { flex: 1; min-width: 140px; }
.team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px,1fr)); gap: 16px; }
.team-card-head { display: flex; justify-content: space-between; align-items: center; }
.team-card-head h3 { font-family: Georgia, serif; color: var(--ink); margin: 0; }
.agent-list { list-style: none; padding: 0; margin: 10px 0; max-height: 220px; overflow-y: auto; }
.agent-list li { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink); }

/* ---------- Settings ---------- */
.settings { display: flex; flex-direction: column; gap: 18px; }
.settings-locked { opacity: .55; filter: grayscale(.3); }
input:disabled, button:disabled { cursor: not-allowed; opacity: .7; }
.settings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px,1fr)); gap: 14px; }
.settings-field { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--slate); font-weight: 600; }
.settings-field input { font-family: 'SFMono-Regular', Consolas, monospace; }
.settings-field.readonly { justify-content: center; }
.settings-field.readonly span { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 17px; color: #9A7A42; font-weight: 700; }

.boost-table { display: flex; flex-direction: column; gap: 4px; overflow-x: auto; }
.boost-row { display: grid; grid-template-columns: 88px repeat(9, 62px); gap: 4px; align-items: center; }
.boost-row.boost-head span { font-size: 9.5px; text-align: center; color: var(--slate); text-transform: uppercase; letter-spacing: .03em; }
.boost-week { font-size: 12px; font-weight: 700; color: var(--ink); }
.boost-cell { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; font-weight: 700; border: 1px solid var(--line); border-radius: 4px; padding: 6px 0; background: var(--card-2); color: var(--slate); cursor: pointer; }
.boost-cell.on { background: var(--gold-grad); color: #fff; border-color: transparent; }

/* ---------- Admin / export ---------- */
.admin-card { border: 1.5px dashed var(--gold); }
.admin-badge { display: inline-block; background: var(--gold-grad); color: #221708; font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; padding: 2px 8px; border-radius: 10px; margin-left: 8px; }
.lock-note { display: flex; align-items: center; gap: 8px; color: var(--slate); font-size: 13px; }

/* ---------- Loading / empty states ---------- */
.loading-screen { display: flex; align-items: center; justify-content: center; min-height: 60vh; flex-direction: column; gap: 14px; color: var(--slate-light); }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.2); border-top-color: var(--gold); animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { }
}
</style>
</head>

    <div class="spinner"></div>

  </div>
</div>

    var p = key.split("-"); var y = Number(p[0]), m = Number(p[1]) - 1;
    var total = y * 12 + m + delta; var ny = Math.floor(total / 12), nm = ((total % 12) + 12) % 12;
    return monthKey(ny, nm);

    var boosted = (weekBoosts && weekBoosts[week]) || [];
    var total = 0;
    ACTIONS.forEach(function (a) {
      var mult = boosted.indexOf(a.key) >= 0 ? 2 : 1;
      total += (counts[a.key] || 0) * (points[a.key] || 0) * mult;
    });
    return total;
  }
  function fmtPts(n) { return (Math.round((n || 0) * 10) / 10).toLocaleString("ru-RU"); }
  function fmtRub(n) { return Math.round(n || 0).toLocaleString("ru-RU") + " ₽"; }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ============================================================
     СЛОЙ ДАННЫХ: Supabase (общая база, одинаковая для всех)
  ============================================================ */
  // sessionStorage может быть недоступен (приватный режим, строгие настройки) — не даём этому ронять сайт
  var safeSession = {
    get: function (k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { sessionStorage.removeItem(k); } catch (e) {} }
  };
  var supa = null;
  var AppState = {
    ready: false,
    configOk: null,
    isAdmin: safeSession.get("rop-admin") === "1",
    teams: [],
    agents: [],
    monthOrder: [],
    currentMonth: null,
    monthSettings: null,
    monthEntries: [],
    syncStatus: "ok"
  };

  function setSync(status) {
    AppState.syncStatus = status;
    var dot = document.getElementById("sync-dot");
    if (dot) dot.className = "sync-dot" + (status === "saving" ? " saving" : status === "off" ? " off" : "");
  }

  function checkConfig() {
    var url = (window.SUPABASE_URL || "").trim(), key = (window.SUPABASE_ANON_KEY || "").trim();
    if (!url || !key || url.indexOf("PASTE_YOUR") === 0 || key.indexOf("PASTE_YOUR") === 0) return false;
    // Убираем случайный хвост вроде /rest/v1/ и лишние слэши — нужен только https://xxxx.supabase.co
    url = url.replace(/\/rest\/v1\/?$/i, "").replace(/\/+$/, "");
    window.SUPABASE_URL = url;
    window.SUPABASE_ANON_KEY = key;
    return true;
  }

  function isSecretKey(key) {
    return /^sb_secret_/i.test(key) || /service_role/i.test(key);
  }

  var channels = [];
  async function dbInit() {
    AppState.configOk = checkConfig();
    if (!AppState.configOk) { AppState.ready = true; render(); return; }

    if (isSecretKey(window.SUPABASE_ANON_KEY)) {
      AppState.loadError = "В index.html вставлен СЕКРЕТНЫЙ ключ (sb_secret_… / service_role). Его нельзя выкладывать на сайт. Возьмите публичный ключ: Supabase → Project Settings → API → «Publishable key» (sb_publishable_…) или «anon public».";
      AppState.ready = true; render(); return;
    }

    try {
      supa = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
      await Promise.all([loadTeams(), loadAgents(), loadMonthOrder()]);
      if (AppState.loadError) { AppState.ready = true; render(); return; }
      if (AppState.monthOrder.length) {
        AppState.currentMonth = AppState.monthOrder[AppState.monthOrder.length - 1];
        await loadCurrentMonth();
      }
      AppState.ready = true;
      render();
      subscribeRealtime();
    } catch (e) {
      AppState.loadError = "Не удалось подключиться к Supabase: " + (e && e.message ? e.message : e) + ". Проверьте SUPABASE_URL (должно быть вида https://xxxx.supabase.co) и ключ.";
      AppState.ready = true; render();
    }
  }

  function noteLoadError(table, error) {
    AppState.loadError = "Supabase не отдал таблицу «" + table + "» (" + (error.message || error.code || "ошибка") + "). " +
      "Проверьте: 1) SUPABASE_URL — только https://xxxx.supabase.co, без /rest/v1; 2) выполнен supabase_schema.sql; 3) ключ публичный (publishable / anon).";
  }
  async function loadTeams() {
    var { data, error } = await supa.from("teams").select("*").order("name");
    if (error) { noteLoadError("teams", error); return; }
    AppState.teams = data || [];
  }
  async function loadAgents() {
    var { data, error } = await supa.from("agents").select("*");
    if (error) { noteLoadError("agents", error); return; }
    AppState.agents = (data || []).map(function (r) { return { id: r.id, name: r.name, ropId: r.rop_id }; });
  }
  async function loadMonthOrder() {
    var { data, error } = await supa.from("month_order").select("key").order("key");
    if (error) { noteLoadError("month_order", error); return; }
    AppState.monthOrder = (data || []).map(function (r) { return r.key; });
  }
  async function loadCurrentMonth() {
    var key = AppState.currentMonth;
    var { data: mData } = await supa.from("months").select("settings").eq("key", key).maybeSingle();
    AppState.monthSettings = (mData && mData.settings) || defaultSettings();
    var { data: eData } = await supa.from("entries").select("*").eq("month_key", key);
    AppState.monthEntries = (eData || []).map(function (r) {
      return { agentId: r.agent_id, week: r.week, counts: r.counts || {}, dealSum: Number(r.deal_sum) || 0 };
    });
  }

  function subscribeRealtime() {
    channels.forEach(function (ch) { supa.removeChannel(ch); });
    channels = [];
    ["teams", "agents", "month_order", "months", "entries"].forEach(function (table) {
      var ch = supa.channel("live-" + table)
        .on("postgres_changes", { event: "*", schema: "public", table: table }, async function () {
          if (table === "teams") await loadTeams();
          else if (table === "agents") await loadAgents();
          else if (table === "month_order") {
            var before = AppState.monthOrder.slice();
            await loadMonthOrder();
            if (JSON.stringify(before) !== JSON.stringify(AppState.monthOrder) && !AppState.currentMonth && AppState.monthOrder.length) {
              AppState.currentMonth = AppState.monthOrder[AppState.monthOrder.length - 1];
              await loadCurrentMonth();
            }
          } else if (table === "months" && AppState.currentMonth) {
            var { data } = await supa.from("months").select("settings").eq("key", AppState.currentMonth).maybeSingle();
            if (data) AppState.monthSettings = data.settings;
          } else if (table === "entries" && AppState.currentMonth) {
            var { data: eData } = await supa.from("entries").select("*").eq("month_key", AppState.currentMonth);
            AppState.monthEntries = (eData || []).map(function (r) {
              return { agentId: r.agent_id, week: r.week, counts: r.counts || {}, dealSum: Number(r.deal_sum) || 0 };
            });
          }
          render();
        })
        .subscribe();
      channels.push(ch);
    });
  }

  async function switchMonth(key) {
    AppState.currentMonth = key;
    AppState.monthSettings = null;
    AppState.monthEntries = [];
    render();
    await loadCurrentMonth();
    render();
  }

  // ---------- Записи (баллы за неделю) ----------
  async function saveEntry(entry) {
    if (!supa || !AppState.currentMonth) return;
    setSync("saving");
    var id = entryDocId(AppState.currentMonth, entry.agentId, entry.week);
    var row = { id: id, month_key: AppState.currentMonth, week: entry.week, agent_id: entry.agentId, counts: entry.counts, deal_sum: entry.dealSum, updated_at: new Date().toISOString() };
    var { error } = await supa.from("entries").upsert(row);
    setSync(error ? "off" : "ok");
    if (!error) await loadCurrentMonth();
  }
  async function deleteEntryDoc(agentId, week) {
    if (!supa || !AppState.currentMonth) return;
    setSync("saving");
    var id = entryDocId(AppState.currentMonth, agentId, week);
    var { error } = await supa.from("entries").delete().eq("id", id);
    setSync(error ? "off" : "ok");
    if (!error) await loadCurrentMonth();
  }

  // ---------- Настройки месяца ----------
  async function saveMonthSettings(settings) {
    if (!supa || !AppState.currentMonth) return;
    setSync("saving");
    var { error } = await supa.from("months").upsert({ key: AppState.currentMonth, settings: settings });
    setSync(error ? "off" : "ok");
    AppState.monthSettings = settings;
    render();
  }

  // ---------- Ростер ----------
  async function saveTeamsFull(list) {
    setSync("saving");
    var rows = list.map(function (t) { return { id: t.id, name: t.name, city: t.city, count: t.count }; });
    var { error } = await supa.from("teams").upsert(rows);
    setSync(error ? "off" : "ok");
    await loadTeams(); render();
  }
  async function saveAgentsFull(list) {
    setSync("saving");
    var rows = list.map(function (a) { return { id: a.id, name: a.name, rop_id: a.ropId }; });
    var { error } = await supa.from("agents").upsert(rows);
    setSync(error ? "off" : "ok");
    await loadAgents(); render();
  }
  async function deleteTeamRow(id) {
    setSync("saving");
    await supa.from("teams").delete().eq("id", id);
    setSync("ok"); await loadTeams(); render();
  }
  async function deleteAgentRow(id) {
    setSync("saving");
    await supa.from("agents").delete().eq("id", id);
    setSync("ok"); await loadAgents(); render();
  }

  async function createMonth(key) {
    if (AppState.monthOrder.indexOf(key) === -1) {
      setSync("saving");
      await supa.from("month_order").upsert({ key: key });
      var baseSettings = AppState.monthSettings || defaultSettings();
      await supa.from("months").upsert({ key: key, settings: JSON.parse(JSON.stringify(baseSettings)) });
      await loadMonthOrder();
      setSync("ok");
    }
    await switchMonth(key);
  }

  // ---------- Данные произвольного месяца (для комиссий — разовое чтение) ----------
  var prevMonthCache = {};
  async function loadPrevMonthData(key) {
    if (prevMonthCache.hasOwnProperty(key)) return prevMonthCache[key];
    var { data: mData } = await supa.from("months").select("settings").eq("key", key).maybeSingle();
    if (!mData) { prevMonthCache[key] = null; return null; }
    var { data: eData } = await supa.from("entries").select("*").eq("month_key", key);
    var result = {
      settings: mData.settings,
      entries: (eData || []).map(function (r) { return { agentId: r.agent_id, week: r.week, counts: r.counts || {}, dealSum: Number(r.deal_sum) || 0 }; })
    };
    prevMonthCache[key] = result;
    return result;
  }

  // ---------- Админ-доступ (пин-код через RPC, сам пин не хранится в JS) ----------
  async function tryAdminPin(pin) {
    var { data, error } = await supa.rpc("verify_admin_pin", { pin: pin });
    if (error) return false;
    return data === true;
  }
  async function setAdminPin(oldPin, newPin) {
    var { data, error } = await supa.rpc("set_admin_pin", { old_pin: oldPin || "", new_pin: newPin });
    if (error) return false;
    return data === true;
  }
  function agentById(id) {
    for (var i = 0; i < AppState.agents.length; i++) if (AppState.agents[i].id === id) return AppState.agents[i];
    return null;
  }
  function teamById(id) {
    for (var i = 0; i < AppState.teams.length; i++) if (AppState.teams[i].id === id) return AppState.teams[i];
    return null;
  }

  function computeTeamStats() {
    var settings = AppState.monthSettings || defaultSettings();
    var entries = AppState.monthEntries || [];
    return AppState.teams.map(function (t) {
      var teamAgentIds = {};
      AppState.agents.forEach(function (a) { if (a.ropId === t.id) teamAgentIds[a.id] = true; });
      var teamEntries = entries.filter(function (e) { return teamAgentIds[e.agentId]; });
      var totalPts = teamEntries.reduce(function (s, e) {
        return s + entryPoints(e.counts, settings.points, e.week, settings.weekBoosts);
      }, 0);
      var deals = teamEntries.reduce(function (s, e) { return s + (e.counts.deal || 0); }, 0);
      var revenue = teamEntries.reduce(function (s, e) { return s + (e.dealSum || 0); }, 0);
      var base = t.count * settings.weeklyMin * settings.weeksPerMonth;
      var th05 = base * settings.tierMult.t05;
      var th1 = base * settings.tierMult.t1;
      var th2 = base * settings.tierMult.t2;
      var tier = 0, tierLabel = "0%";
      if (totalPts >= th2) { tier = 0.02; tierLabel = "2%"; }
      else if (totalPts >= th1) { tier = 0.01; tierLabel = "1%"; }
      else if (totalPts >= th05) { tier = 0.005; tierLabel = "0,5%"; }
      var bonus = revenue * tier;
      var progress = th2 > 0 ? Math.min(1, totalPts / th2) : 0;

      var below = 0;
      WEEKS.forEach(function (w) {
        Object.keys(teamAgentIds).forEach(function (aid) {
          var e = entries.find(function (x) { return x.agentId === aid && x.week === w; });
          if (e) {
            var p = entryPoints(e.counts, settings.points, e.week, settings.weekBoosts);
            if (p < settings.weeklyMin) below++;
          }
        });
      });

      var catCounts = {};
      ACTIONS.forEach(function (a) {
        catCounts[a.key] = teamEntries.reduce(function (s, e) { return s + (e.counts[a.key] || 0); }, 0);
      });

      var agentCount = Object.keys(teamAgentIds).length;
      return {
        id: t.id, name: t.name, city: t.city, count: t.count, agentCount: agentCount,
        totalPts: totalPts, deals: deals, th05: th05, th1: th1, th2: th2,
        tier: tier, tierLabel: tierLabel, revenue: revenue, bonus: bonus,
        progress: progress, below: below, catCounts: catCounts
      };
    });
  }
  function computeTeamRanking(teamStats) {
    return teamStats.slice().sort(function (a, b) { return b.totalPts - a.totalPts; });
  }

  function computeAgentStats() {
    var settings = AppState.monthSettings || defaultSettings();
    var entries = AppState.monthEntries || [];
    return AppState.agents.map(function (a) {
      var aEntries = entries.filter(function (e) { return e.agentId === a.id; });
      var totalPts = aEntries.reduce(function (s, e) {
        return s + entryPoints(e.counts, settings.points, e.week, settings.weekBoosts);
      }, 0);
      var deals = aEntries.reduce(function (s, e) { return s + (e.counts.deal || 0); }, 0);
      var revenue = aEntries.reduce(function (s, e) { return s + (e.dealSum || 0); }, 0);
      var team = teamById(a.ropId);
      return { id: a.id, name: a.name, ropId: a.ropId, ropName: team ? team.name : "—", city: team ? team.city : "—", totalPts: totalPts, deals: deals, revenue: revenue };
    }).sort(function (a, b) { return b.totalPts - a.totalPts; });
  }

  function computeBelowNormList() {
    var settings = AppState.monthSettings || defaultSettings();
    var entries = AppState.monthEntries || [];
    var list = [];
    entries.forEach(function (e) {
      var pts = entryPoints(e.counts, settings.points, e.week, settings.weekBoosts);
      if (pts < settings.weeklyMin) {
        var a = agentById(e.agentId);
        if (a) {
          var team = teamById(a.ropId);
          list.push({ id: e.week + "_" + e.agentId, week: e.week, pts: pts, agentName: a.name, ropName: team ? team.name : "—" });
        }
      }
    });
    return list.sort(function (a, b) { return a.week - b.week; });
  }

  // Грейд агента для произвольного набора {settings, entries} (текущий месяц или закешированный прошлый)
  function gradeFromData(agent, data) {
    if (!data) return null;
    var settings = data.settings;
    var entries = data.entries.filter(function (e) { return e.agentId === agent.id; });
    var pts = entries.reduce(function (s, e) { return s + entryPoints(e.counts, settings.points, e.week, settings.weekBoosts); }, 0);
    var deals = entries.reduce(function (s, e) { return s + (e.counts.deal || 0); }, 0);
    var revenue = entries.reduce(function (s, e) { return s + (e.dealSum || 0); }, 0);
    var pointsPlan = settings.weeklyMin * settings.weeksPerMonth;
    var revenuePlan = settings.revenuePlan || 0;
    var ptsRatio = pointsPlan > 0 ? pts / pointsPlan : 0;
    var revRatio = revenuePlan > 0 ? revenue / revenuePlan : 0;
    var ratio = Math.max(ptsRatio, revRatio);
    var pct = ratio * 100;
    var c = settings.commission;
    var tier;
    if (pct < c.p1) tier = "A"; else if (pct <= c.p2) tier = "B"; else if (pct <= c.p3) tier = "C"; else tier = "D";
    return { pts: pts, deals: deals, revenue: revenue, pointsPlan: pointsPlan, revenuePlan: revenuePlan, pct: pct, tier: tier };
  }

  function activeCommissionRate(agent, prevData) {
    var settings = AppState.monthSettings || defaultSettings();
    var c = settings.commission;
    var prevGrade = gradeFromData(agent, prevData);
    if (!prevGrade) return { rate: c.bRate, note: "нет данных за прошлый месяц — стандартная ставка" };
    var curEntries = (AppState.monthEntries || []).filter(function (e) { return e.agentId === agent.id; });
    var curDeals = curEntries.reduce(function (s, e) { return s + (e.counts.deal || 0); }, 0);
    if (prevGrade.tier === "A") {
      var n = c.aDealsCount || 3;
      if (curDeals < n) return { rate: c.aRate, note: (n - curDeals) + " сдел. по " + c.aRate + "% из " + n + ", далее " + c.aStandard + "%" };
      return { rate: c.aStandard, note: "лимит по сниженной ставке исчерпан (" + n + " сделки)" };
    }
    if (prevGrade.tier === "B") return { rate: c.bRate, note: "" };
    if (prevGrade.tier === "C") return { rate: c.cRate, note: "" };
    return { rate: c.dRate, note: "" };
  }
  function sealSvg(progress, tierLabel, pts, size) {
    size = size || 128;
    var r = size / 2 - 10;
    var c = 2 * Math.PI * r;
    var dash = c * Math.min(1, Math.max(0, progress));
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
      '<defs><linearGradient id="gg' + size + '" x1="0%" y1="0%" x2="100%" y2="100%">' +
      '<stop offset="0%" stop-color="#D4B483"/><stop offset="100%" stop-color="#A07C48"/></linearGradient></defs>' +
      '<circle cx="' + (size / 2) + '" cy="' + (size / 2) + '" r="' + r + '" fill="none" stroke="#EFEBE2" stroke-width="8"/>' +
      '<circle cx="' + (size / 2) + '" cy="' + (size / 2) + '" r="' + r + '" fill="none" stroke="url(#gg' + size + ')" stroke-width="8" stroke-linecap="round" ' +
        'stroke-dasharray="' + dash + ' ' + c + '" transform="rotate(-90 ' + (size / 2) + ' ' + (size / 2) + ')"/>' +
      '<text x="50%" y="46%" text-anchor="middle" class="seal-num">' + esc(fmtPts(pts)) + '</text>' +
      '<text x="50%" y="64%" text-anchor="middle" class="seal-sub">баллов</text>' +
      '<text x="50%" y="80%" text-anchor="middle" class="seal-tier">' + esc(tierLabel) + '</text>' +
      '</svg>';
  }

  /* ============================================================
     РЕНДЕР: ШАПКА / МЕСЯЦЫ / ВКЛАДКИ
  ============================================================ */

  var UI = { tab: "dash", addMonthOpen: false, filterWeek: "all" };

  function renderDashboard() {
    var settings = AppState.monthSettings || defaultSettings();
    var teamStats = computeTeamStats();
    var teamRanking = computeTeamRanking(teamStats);

    html += '<h2 class="section-title">Рейтинг команд (РОПов)</h2>';

      '<th>Сделок</th><th>Валовая выручка</th></tr></thead><tbody>';
    teamRanking.forEach(function (t, i) {

    });
    html += '</tbody></table></div>';

    html += '<h2 class="section-title">Команды РОПов</h2>';
    CITIES.forEach(function (city) {
      var cityTeams = teamStats.filter(function (t) { return t.city === city; });
      if (!cityTeams.length) return;
      html += '<p class="muted on-dark" style="margin:10px 0 8px 0;font-weight:600;color:#fff;">' + esc(city) + '</p>';
      html += '<div class="seal-grid">';
      cityTeams.forEach(function (t) {
        html += '<div class="seal-card">' + sealSvg(t.progress, t.tierLabel, t.totalPts) +
          '<div class="seal-meta"><h3>' + esc(t.name) + '</h3><p class="muted">' + t.agentCount + ' агентов</p>' +
          '<div class="thresh-row">' +
            '<span class="' + (t.totalPts >= t.th05 ? "hit" : "") + '">0,5% ≥ ' + esc(fmtPts(t.th05)) + '</span>' +
            '<span class="' + (t.totalPts >= t.th1 ? "hit" : "") + '">1% ≥ ' + esc(fmtPts(t.th1)) + '</span>' +
            '<span class="' + (t.totalPts >= t.th2 ? "hit" : "") + '">2% ≥ ' + esc(fmtPts(t.th2)) + '</span>' +
          '</div>' +

          '<div class="bonus-final">Бонус РОПа: <b>' + esc(fmtRub(t.bonus)) + '</b></div>' +

          '</div></div>';
      });
      html += '</div>';

    var yearNow = Number(nextParts[0]);
    var yearOptions = "";
    for (var y = yearNow - 2; y <= yearNow + 3; y++) yearOptions += '<option value="' + y + '"' + (y === yearNow ? " selected" : "") + '>' + y + '</option>';
    var monthNameOptions = RUS_MONTHS.map(function (name, idx) {
      return '<option value="' + idx + '"' + (idx === Number(nextParts[1]) - 1 ? " selected" : "") + '>' + name + '</option>';
    }).join("");

    var whoHtml = AppState.isAdmin ? '<div class="who-box"><span class="admin-badge">админ</span></div>' : "";

    return '' +
      '<div class="site-header">' +
        '<div class="brand">' +
          '<img src="data:image/png;base64,' + LOGO_B64 + '" alt="Т—Недвижимость"/>' +
          '<div><h1>Т—Недвижимость</h1><p>Баллы, бонусы РОПов и комиссии агентов</p></div>' +
        '</div>' +
        '<div class="header-right">' +
          whoHtml +
          '<div class="month-wrap">' +
            '<div style="display:flex;align-items:flex-end;gap:10px;">' +
              '<div class="month-box"><span>Месяц</span><select id="month-select">' + monthOptions + '</select></div>' +
              '<button class="add-month-btn" id="add-month-toggle" type="button">+ Месяц</button>' +
            '</div>' +
            '<div class="add-month-form' + (UI.addMonthOpen ? " open" : "") + '" id="add-month-form">' +
              '<label>Месяц<select id="new-month-name">' + monthNameOptions + '</select></label>' +
              '<label>Год<select id="new-month-year">' + yearOptions + '</select></label>' +
              '<button class="btn-primary" id="create-month-btn" type="button">Создать</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  function renderTabs() {
    var tabs = [["dash", "Дашборд"], ["entry", "Баллы за неделю"], ["commissions", "Комиссии"], ["team", "Команда"], ["settings", "Настройки"], ["admin", "Экспорт"]];
    return '<div class="tabs">' +
      '<div class="tabs-left">' + tabs.map(function (t) {
        var active = UI.tab === t[0] ? " active" : "";
        return '<button class="tab' + active + '" data-tab="' + t[0] + '">' + t[1] + '</button>';
      }).join("") + '</div>' +
      '<div class="sync-note"><span class="sync-dot' + (AppState.syncStatus === "saving" ? " saving" : AppState.syncStatus === "off" ? " off" : "") + '" id="sync-dot"></span>Общие данные — видны всем на сайте</div>' +
      '</div>';
  }

  /* ============================================================
     РЕНДЕР: ЭКСПОРТ (пин-код администратора)
  ============================================================ */
  var adminPinMsg = "";
  function renderAdmin() {
    if (!AppState.isAdmin) {
      var html = '<div class="card"><h2 class="section-title" style="margin-top:0;">Доступ администратора</h2>' +
        '<p class="muted">Экспорт в Excel и управление пин-кодом доступны только по пин-коду администратора.</p>' +
        '<div class="form-row"><label>Пин-код<input type="password" id="admin-pin-input" placeholder="••••"/></label></div>' +
        '<button class="btn-primary" id="admin-pin-submit">Войти</button>' +
        (adminPinMsg ? '<p class="muted small" style="color:#B8492F;">' + esc(adminPinMsg) + '</p>' : '') +
        '<p class="muted small">Если пин ещё не задавали — просто впишите любой новый пин и нажмите «Войти»: он станет постоянным паролем администратора.</p>' +
        '</div>';
      return html;
    }
    var html2 = '<div class="card admin-card"><h2 class="section-title" style="margin-top:0;">Экспорт всех данных в Excel<span class="admin-badge">админ</span></h2>';
    html2 += '<p class="muted">Выгружает книгу со всеми месяцами: баллы, суммы сделок, команды, агентов и итоги — всё, что сейчас хранится в общей базе.</p>';
    html2 += '<button class="btn-primary" id="export-excel-btn">Скачать Excel (.xlsx)</button>';
    html2 += '<p class="muted small" id="export-status"></p></div>';

    html2 += '<div class="card" style="margin-top:16px;"><h2 class="section-title" style="margin-top:0;">Сменить пин-код</h2>' +
      '<div class="form-row">' +
      '<label>Текущий пин<input type="password" id="pin-old"/></label>' +
      '<label>Новый пин<input type="password" id="pin-new"/></label>' +
      '</div><button class="btn-ghost" id="pin-change-btn">Сохранить новый пин</button>' +
      '<p class="muted small" id="pin-change-status"></p>' +
      '<button class="btn-ghost" id="admin-logout-btn" style="margin-top:10px;">Выйти из режима администратора</button>' +
      '</div>';
    return html2;
  }

  /* ============================================================
     ЭКСПОРТ В EXCEL — читает ВСЕ месяцы, обычное скачивание в браузере
  ============================================================ */
  async function exportAllToExcel() {
    var statusEl = document.getElementById("export-status");
    if (statusEl) statusEl.textContent = "Собираю данные со всех месяцев…";
    try {
      var wb = XLSX.utils.book_new();

      var agentsRows = AppState.agents.map(function (a) {
        var t = teamById(a.ropId);
        return { ID: a.id, Агент: a.name, РОП: t ? t.name : "", Город: t ? t.city : "" };
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(agentsRows), "Агенты");

      var teamsRows = AppState.teams.map(function (t) {
        return { ID: t.id, РОП: t.name, Город: t.city, "Кол-во агентов": t.count };
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(teamsRows), "Команды");

      var summaryRows = [];
      for (var mi = 0; mi < AppState.monthOrder.length; mi++) {
        var key = AppState.monthOrder[mi];
        var data = key === AppState.currentMonth
          ? { settings: AppState.monthSettings || defaultSettings(), entries: AppState.monthEntries || [] }
          : await loadPrevMonthData(key);
        if (!data) continue;
        if (statusEl) statusEl.textContent = "Обрабатываю " + monthLabel(key) + "…";

        var entryRows = data.entries.map(function (e) {
          var a = agentById(e.agentId);
          var team = a ? teamById(a.ropId) : null;
          var pts = entryPoints(e.counts, data.settings.points, e.week, data.settings.weekBoosts);
          var row = { Неделя: e.week, Агент: a ? a.name : e.agentId, РОП: team ? team.name : "", Город: team ? team.city : "" };
          ACTIONS.forEach(function (act) { row[act.label] = e.counts[act.key] || 0; });
          row["Баллы"] = Math.round(pts * 10) / 10;
          row["Сумма сделок, ₽"] = e.dealSum || 0;
          return row;
        });
        var sheetName = monthLabel(key).slice(0, 31);
        var ws = entryRows.length ? XLSX.utils.json_to_sheet(entryRows) : XLSX.utils.aoa_to_sheet([["Записей нет"]]);
        XLSX.utils.book_append_sheet(wb, ws, sheetName);

        AppState.teams.forEach(function (t) {
          var teamAgentIds = {};
          AppState.agents.forEach(function (a) { if (a.ropId === t.id) teamAgentIds[a.id] = true; });
          var teamEntries = data.entries.filter(function (e) { return teamAgentIds[e.agentId]; });
          var totalPts = teamEntries.reduce(function (s, e) { return s + entryPoints(e.counts, data.settings.points, e.week, data.settings.weekBoosts); }, 0);
          var deals = teamEntries.reduce(function (s, e) { return s + (e.counts.deal || 0); }, 0);
          var revenue = teamEntries.reduce(function (s, e) { return s + (e.dealSum || 0); }, 0);
          var base = t.count * data.settings.weeklyMin * data.settings.weeksPerMonth;
          var tierPct = 0;
          if (totalPts >= base * data.settings.tierMult.t2) tierPct = 2;
          else if (totalPts >= base * data.settings.tierMult.t1) tierPct = 1;
          else if (totalPts >= base * data.settings.tierMult.t05) tierPct = 0.5;
          summaryRows.push({
            Месяц: monthLabel(key), РОП: t.name, Город: t.city,
            Баллы: Math.round(totalPts * 10) / 10, Сделок: deals,
            "Выручка, ₽": revenue, "Бонус РОПа, %": tierPct, "Бонус РОПа, ₽": Math.round(revenue * tierPct / 100)
          });
        });
      }
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summaryRows), "Итоги по месяцам");

      var filename = "Т-Недвижимость_баллы_" + (new Date().toISOString().slice(0, 10)) + ".xlsx";
      XLSX.writeFile(wb, filename);
      if (statusEl) statusEl.textContent = "Файл сохранён: " + filename;
    } catch (e) {
      console.warn("export failed", e);
      if (statusEl) statusEl.textContent = "Не удалось выгрузить: " + (e && e.message ? e.message : "ошибка");
    }
  }

  /* ============================================================
     ГЛАВНЫЙ РЕНДЕР
  ============================================================ */
  var root = document.getElementById("root");

  function render() {
    if (AppState.configOk === false) {
      root.innerHTML = '<div class="loading-screen"><div style="font-size:32px;">⚙️</div>' +
        '<div style="max-width:480px;text-align:center;">Сайт ещё не настроен: впишите Project URL и anon key вашего проекта Supabase в начало файла index.html (переменные SUPABASE_URL и SUPABASE_ANON_KEY) и выполните supabase_schema.sql в Supabase SQL Editor.</div></div>';
      return;
    }
    if (AppState.loadError) {
      root.innerHTML = '<div class="loading-screen"><div style="font-size:32px;">⚠️</div>' +
        '<div style="max-width:560px;text-align:center;line-height:1.5;">' + esc(AppState.loadError) + '</div></div>';
      return;
    }
    if (!AppState.ready) {
      root.innerHTML = '<div class="loading-screen"><div class="spinner"></div><div>Загрузка данных…</div></div>';
      return;
    }
    if (!AppState.currentMonth) {
      root.innerHTML = '<div class="loading-screen"><div style="font-size:32px;">📭</div>' +
        '<div style="max-width:560px;text-align:center;line-height:1.5;">В базе пока нет ни одного месяца. Выполните supabase_schema.sql в Supabase SQL Editor (он создаёт август 2026 и все команды).</div></div>';
      return;
    }
    var body = "";
    if (UI.tab === "dash") body = renderDashboard();
    else if (UI.tab === "entry") body = renderEntry();
    else if (UI.tab === "commissions") body = renderCommissions();
    else if (UI.tab === "team") body = renderTeam();
    else if (UI.tab === "settings") body = renderSettings();
    else if (UI.tab === "admin") body = renderAdmin();

    root.innerHTML = '<div class="wrap">' + renderHeader() + renderTabs() + '<div class="main">' + body + '</div></div>';
    bindEvents();
  }

  /* ============================================================
     СОБЫТИЯ
  ============================================================ */
  function bindEvents() {
    root.querySelectorAll("[data-tab]").forEach(function (btn) {
      btn.addEventListener("click", function () { UI.tab = btn.getAttribute("data-tab"); adminPinMsg = ""; render(); });
    });

    var monthSelect = root.querySelector("#month-select");
    if (monthSelect) monthSelect.addEventListener("change", function () { switchMonth(monthSelect.value); });

    var addMonthToggle = root.querySelector("#add-month-toggle");
    if (addMonthToggle) addMonthToggle.addEventListener("click", function () { UI.addMonthOpen = !UI.addMonthOpen; render(); });

    var createMonthBtn = root.querySelector("#create-month-btn");
    if (createMonthBtn) createMonthBtn.addEventListener("click", async function () {
      var monthSel = root.querySelector("#new-month-name");
      var yearSel = root.querySelector("#new-month-year");
      var key = monthKey(Number(yearSel.value), Number(monthSel.value));
      UI.addMonthOpen = false;
      await createMonth(key);
    });

    if (UI.tab === "entry") bindEntryEvents();
    if (UI.tab === "team") bindTeamEvents();
    if (UI.tab === "settings") bindSettingsEvents();
    if (UI.tab === "admin") bindAdminEvents();
  }

  function bindEntryEvents() {
    var wk = root.querySelector("#f-week");
    if (wk) wk.addEventListener("change", function () { draft.week = Number(wk.value); render(); });

    var ropSel = root.querySelector("#f-rop");
    if (ropSel) ropSel.addEventListener("change", function () {
      draft.ropId = ropSel.value;
      var teamAgents = AppState.agents.filter(function (a) { return a.ropId === draft.ropId; });
      draft.agentId = teamAgents[0] ? teamAgents[0].id : null;
      render();
    });

    var agentSel = root.querySelector("#f-agent");
    if (agentSel) agentSel.addEventListener("change", function () {
      draft.agentId = agentSel.value;
      var existing = (AppState.monthEntries || []).find(function (e) { return e.agentId === draft.agentId && e.week === draft.week; });
      if (existing) {
        ACTIONS.forEach(function (a) { draft.counts[a.key] = existing.counts[a.key] || 0; });
        draft.dealSum = existing.dealSum || 0;
      }
      render();
    });

    root.querySelectorAll("[data-bump]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var key = btn.getAttribute("data-bump");
        var delta = Number(btn.getAttribute("data-delta"));
        draft.counts[key] = Math.max(0, (draft.counts[key] || 0) + delta);
        render();
      });
    });

    var dealSumInput = root.querySelector("#f-dealsum");
    if (dealSumInput) dealSumInput.addEventListener("input", function () { draft.dealSum = Number(dealSumInput.value) || 0; });

    var saveBtn = root.querySelector("#save-entry");
    if (saveBtn) saveBtn.addEventListener("click", async function () {
      if (!draft.agentId) return;
      var countsCopy = {};
      ACTIONS.forEach(function (a) { countsCopy[a.key] = draft.counts[a.key] || 0; });
      var entry = { week: draft.week, agentId: draft.agentId, counts: countsCopy, dealSum: Number(draft.dealSum) || 0 };
      await saveEntry(entry);
      ACTIONS.forEach(function (a) { draft.counts[a.key] = 0; });
      draft.dealSum = 0;
      render();
    });

    var filterSel = root.querySelector("#filter-week");
    if (filterSel) filterSel.addEventListener("change", function () { UI.filterWeek = filterSel.value; render(); });

    root.querySelectorAll("[data-del-entry-agent]").forEach(function (btn) {
      btn.addEventListener("click", async function () {
        await deleteEntryDoc(btn.getAttribute("data-del-entry-agent"), Number(btn.getAttribute("data-del-entry-week")));
      });
    });
  }

  function bindTeamEvents() {
    var newRopInput = root.querySelector("#new-rop-name");
    if (newRopInput) newRopInput.addEventListener("input", function () { UI2.newRopName = newRopInput.value; });
    var newRopCitySel = root.querySelector("#new-rop-city");
    if (newRopCitySel) newRopCitySel.addEventListener("change", function () { UI2.newRopCity = newRopCitySel.value; });

    var addRopBtn = root.querySelector("#add-rop-btn");
    if (addRopBtn) addRopBtn.addEventListener("click", async function () {
      var name = (UI2.newRopName || "").trim();
      if (!name) return;
      var newTeams = AppState.teams.concat([{ id: uid(), name: name, city: UI2.newRopCity || CITIES[0], count: 0 }]);
      UI2.newRopName = "";
      await saveTeamsFull(newTeams);
    });

    root.querySelectorAll("[data-del-rop]").forEach(function (btn) {
      btn.addEventListener("click", async function () {
        var ropId = btn.getAttribute("data-del-rop");
        var agentsToRemove = AppState.agents.filter(function (a) { return a.ropId === ropId; });
        for (var i = 0; i < agentsToRemove.length; i++) await deleteAgentRow(agentsToRemove[i].id);
        await deleteTeamRow(ropId);
      });
    });

    root.querySelectorAll("[data-new-agent-input]").forEach(function (inp) {
      inp.addEventListener("input", function () { UI2.newAgentNameByRop[inp.getAttribute("data-new-agent-input")] = inp.value; });
    });

    root.querySelectorAll("[data-add-agent]").forEach(function (btn) {
      btn.addEventListener("click", async function () {
        var ropId = btn.getAttribute("data-add-agent");
        var name = (UI2.newAgentNameByRop[ropId] || "").trim();
        if (!name) return;
        var newAgents = AppState.agents.concat([{ id: uid(), name: name, ropId: ropId }]);
        var newTeams = AppState.teams.map(function (t) { return t.id === ropId ? Object.assign({}, t, { count: (t.count || 0) + 1 }) : t; });
        UI2.newAgentNameByRop[ropId] = "";
        await saveAgentsFull(newAgents);
        await saveTeamsFull(newTeams);
      });
    });

    root.querySelectorAll("[data-del-agent]").forEach(function (btn) {
      btn.addEventListener("click", async function () {
        var agentId = btn.getAttribute("data-del-agent");
        var agent = agentById(agentId);
        await deleteAgentRow(agentId);
        if (agent) {
          var newTeams = AppState.teams.map(function (t) { return t.id === agent.ropId ? Object.assign({}, t, { count: Math.max(0, (t.count || 0) - 1) }) : t; });
          await saveTeamsFull(newTeams);
        }
      });
    });
  }

  function bindSettingsEvents() {
    var pinSubmit = root.querySelector("#settings-pin-submit");
    if (pinSubmit) pinSubmit.addEventListener("click", async function () {
      var pin = root.querySelector("#settings-pin-input").value;
      if (!pin) return;
      var ok = await tryAdminPin(pin);
      if (!ok) ok = await setAdminPin("", pin); // первый вход — пин ещё не задан
      if (ok) { AppState.isAdmin = true; safeSession.set("rop-admin", "1"); adminPinMsg = ""; }
      else { adminPinMsg = "Неверный пин-код."; }
      render();
    });
    if (!AppState.isAdmin) return; // поля задизейблены, но на всякий случай не вешаем и обработчики сохранения
    function patchSettings(mutator) {
      var s = JSON.parse(JSON.stringify(AppState.monthSettings || defaultSettings()));
      mutator(s);
      saveMonthSettings(s);
    }
    root.querySelectorAll("[data-point-key]").forEach(function (inp) {
      inp.addEventListener("change", function () { var key = inp.getAttribute("data-point-key"); patchSettings(function (s) { s.points[key] = Number(inp.value) || 0; }); });
    });
    var weeklyMin = root.querySelector("#weekly-min");
    if (weeklyMin) weeklyMin.addEventListener("change", function () { patchSettings(function (s) { s.weeklyMin = Number(weeklyMin.value) || 0; }); });
    var weeksPerMonth = root.querySelector("#weeks-per-month");
    if (weeksPerMonth) weeksPerMonth.addEventListener("change", function () { patchSettings(function (s) { s.weeksPerMonth = Number(weeksPerMonth.value) || 0; }); });
    root.querySelectorAll("[data-tier]").forEach(function (inp) {
      inp.addEventListener("change", function () { var key = inp.getAttribute("data-tier"); patchSettings(function (s) { s.tierMult[key] = Number(inp.value) || 0; }); });
    });
    root.querySelectorAll("[data-boost-week]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var week = btn.getAttribute("data-boost-week"), key = btn.getAttribute("data-boost-key");
        patchSettings(function (s) {
          var arr = s.weekBoosts[week] || []; var idx = arr.indexOf(key);
          if (idx >= 0) arr.splice(idx, 1); else arr.push(key);
          s.weekBoosts[week] = arr;
        });
      });
    });
    var revenuePlan = root.querySelector("#revenue-plan");
    if (revenuePlan) revenuePlan.addEventListener("change", function () { patchSettings(function (s) { s.revenuePlan = Number(revenuePlan.value) || 0; }); });
    root.querySelectorAll("[data-comm]").forEach(function (inp) {
      inp.addEventListener("change", function () { var key = inp.getAttribute("data-comm"); patchSettings(function (s) { s.commission[key] = Number(inp.value) || 0; }); });
    });
  }

  function bindAdminEvents() {
    var pinSubmit = root.querySelector("#admin-pin-submit");
    if (pinSubmit) pinSubmit.addEventListener("click", async function () {
      var pin = root.querySelector("#admin-pin-input").value;
      if (!pin) return;
      var ok = await tryAdminPin(pin);
      if (ok) {
        AppState.isAdmin = true;
        safeSession.set("rop-admin", "1");
        adminPinMsg = "";
      } else {
        // Пин ещё не задан вообще — первый ввод устанавливает его.
        var setOk = await setAdminPin("", pin);
        if (setOk) { AppState.isAdmin = true; safeSession.set("rop-admin", "1"); adminPinMsg = ""; }
        else { adminPinMsg = "Неверный пин-код."; }
      }
      render();
    });

    var exportBtn = root.querySelector("#export-excel-btn");
    if (exportBtn) exportBtn.addEventListener("click", exportAllToExcel);

    var pinChangeBtn = root.querySelector("#pin-change-btn");
    if (pinChangeBtn) pinChangeBtn.addEventListener("click", async function () {
      var oldPin = root.querySelector("#pin-old").value;
      var newPin = root.querySelector("#pin-new").value;
      var statusEl = root.querySelector("#pin-change-status");
      if (!newPin) return;
      var ok = await setAdminPin(oldPin, newPin);
      statusEl.textContent = ok ? "Пин-код обновлён." : "Не удалось: неверный текущий пин.";
    });

    var logoutBtn = root.querySelector("#admin-logout-btn");
    if (logoutBtn) logoutBtn.addEventListener("click", function () {
      AppState.isAdmin = false;
      safeSession.del("rop-admin");
      render();
    });
  }

  /* ============================================================
     СТАРТ
  ============================================================ */
  render();
  dbInit();
})();
</script>
